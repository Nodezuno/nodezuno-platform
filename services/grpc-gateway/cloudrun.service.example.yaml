apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nodezuno-native-grpc
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: nodezuno-native-grpc@PROJECT.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/REPOSITORY/nodezuno-native-grpc:VERSION
          ports:
            - name: h2c
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            grpc:
              port: 8080
              service: nodezuno-native-grpc-liveness
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            grpc:
              port: 8080
              service: nodezuno-native-grpc-liveness
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 8080
              service: nodezuno.ethereum.v1.EthereumProxy
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: NODEZUNO_GRPC_AUTH_MODE
              value: control-plane
            - name: NODEZUNO_GRPC_AUTH_URL
              value: https://nodezuno.com/api/v1/internal/grpc/authorize
            - name: NODEZUNO_GRPC_AUTH_TIMEOUT
              value: 2s
            - name: GRPC_UPSTREAM_TIMEOUT
              value: 12s
            - name: GRPC_SHUTDOWN_TIMEOUT
              value: 8s
            - name: GRPC_MAX_REQUEST_BYTES
              value: "1048576"
            - name: GRPC_MAX_RESPONSE_BYTES
              value: "4194304"
            - name: GRPC_MAX_CONCURRENT_CALLS
              value: "128"
            - name: GRPC_ALLOW_INSECURE_UPSTREAM
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: ETHEREUM_UPSTREAMS_JSON
              valueFrom:
                secretKeyRef:
                  name: nodezuno-ethereum-upstreams
                  key: latest
            - name: NODEZUNO_GRPC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nodezuno-grpc-auth-secret
                  key: latest
