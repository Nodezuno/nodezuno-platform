name: nodezuno-production

services:
  nodezuno:
    image: ${NODEZUNO_IMAGE:?Set NODEZUNO_IMAGE to an immutable ECR image digest}
    pull_policy: missing
    env_file:
      - ${NODEZUNO_APP_ENV_FILE:-/opt/nodezuno/config/.env.production}
    environment:
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION}
      HOSTNAME: 0.0.0.0
      NODEZUNO_DATABASE_DRIVER: sqlite
      NODEZUNO_DEPLOYMENT_TOPOLOGY: single-host-sqlite
      NODEZUNO_DELIVERABLE_BUCKET: ${NODEZUNO_DELIVERABLE_BUCKET:?Set NODEZUNO_DELIVERABLE_BUCKET}
      NODEZUNO_DELIVERABLE_KMS_KEY_ARN: ${NODEZUNO_DELIVERABLE_KMS_KEY_ARN:?Set NODEZUNO_DELIVERABLE_KMS_KEY_ARN}
      NODEZUNO_BACKGROUND_WORKER_OWNER: systemd-single-host
      NODEZUNO_INGRESS_MODE: direct
      NODEZUNO_LOCAL_PREVIEW: "false"
      NODEZUNO_PROCESS_ROLE: web
      NODEZUNO_RUNTIME: container
      NODEZUNO_SQLITE_PATH: /var/lib/nodezuno/nodezuno.sqlite
      NODEZUNO_WEB_REPLICA_COUNT: "1"
      PORT: "3000"
    command:
      - sh
      - -c
      - node scripts/preflight-deployment-topology.mjs web && node scripts/preflight-review-application.mjs && exec flock --exclusive --nonblock --no-fork --conflict-exit-code 78 /var/lib/nodezuno/.nodezuno-web.lock node server.js
    expose:
      - "3000"
    networks:
      nodezuno-front: {}
      nodezuno-web-egress:
        gw_priority: 1
    volumes:
      - /opt/nodezuno/data:/var/lib/nodezuno
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const port=process.env.PORT||'3000';fetch('http://127.0.0.1:'+port+'/api/v1/live').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 640m
    mem_reservation: 384m
    cpus: 1.5
    deploy:
      replicas: 1
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${NODEZUNO_APP_LOG_GROUP:?Set NODEZUNO_APP_LOG_GROUP}
        awslogs-stream: application
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m

  backup:
    image: ${NODEZUNO_IMAGE:?Set NODEZUNO_IMAGE to an immutable ECR image digest}
    pull_policy: missing
    profiles:
      - operations
    environment:
      NODEZUNO_DATABASE_DRIVER: sqlite
      NODEZUNO_SQLITE_PATH: /var/lib/nodezuno/nodezuno.sqlite
    entrypoint:
      - node
      - scripts/backup-sqlite.mjs
    network_mode: none
    volumes:
      - /opt/nodezuno/data:/var/lib/nodezuno:ro
      - /opt/nodezuno/backups:/var/backups/nodezuno
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  restore:
    image: ${NODEZUNO_IMAGE:?Set NODEZUNO_IMAGE to an immutable ECR image digest}
    pull_policy: missing
    profiles:
      - operations
    environment:
      NODEZUNO_DATABASE_DRIVER: sqlite
      NODEZUNO_SQLITE_PATH: /var/lib/nodezuno/nodezuno.sqlite
    entrypoint:
      - node
      - scripts/restore-sqlite.mjs
    network_mode: none
    volumes:
      - /opt/nodezuno/data:/var/lib/nodezuno
      - /opt/nodezuno/backups:/var/backups/nodezuno:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  email-worker:
    image: ${NODEZUNO_IMAGE:?Set NODEZUNO_IMAGE to an immutable ECR image digest}
    pull_policy: missing
    profiles:
      - operations
    env_file:
      - ${NODEZUNO_EMAIL_ENV_FILE:-/opt/nodezuno/config/.env.email-worker}
    environment:
      NODEZUNO_BACKGROUND_WORKER_OWNER: systemd-single-host
      NODEZUNO_DATABASE_DRIVER: sqlite
      NODEZUNO_DEPLOYMENT_TOPOLOGY: single-host-sqlite
      NODEZUNO_LOCAL_PREVIEW: "false"
      NODEZUNO_PROCESS_ROLE: email-worker
      NODEZUNO_RUNTIME: container
      NODEZUNO_SQLITE_PATH: /var/lib/nodezuno/nodezuno.sqlite
      NODEZUNO_WEB_REPLICA_COUNT: "1"
    entrypoint:
      - sh
      - -c
      - node scripts/preflight-deployment-topology.mjs email-worker && exec node scripts/process-notification-outbox.mjs --once
    volumes:
      - /opt/nodezuno/data:/var/lib/nodezuno
    networks:
      nodezuno-email-egress: {}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.25
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${NODEZUNO_APP_LOG_GROUP:?Set NODEZUNO_APP_LOG_GROUP}
        awslogs-stream: email-worker
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 1m

  payment-worker:
    image: ${NODEZUNO_IMAGE:?Set NODEZUNO_IMAGE to an immutable ECR image digest}
    pull_policy: missing
    profiles:
      - operations
    env_file:
      - ${NODEZUNO_PAYMENT_ENV_FILE:-/opt/nodezuno/config/.env.payment-worker}
    environment:
      NODEZUNO_BACKGROUND_WORKER_OWNER: systemd-single-host
      NODEZUNO_DATABASE_DRIVER: sqlite
      NODEZUNO_DEPLOYMENT_TOPOLOGY: single-host-sqlite
      NODEZUNO_LOCAL_PREVIEW: "false"
      NODEZUNO_PROCESS_ROLE: payment-worker
      NODEZUNO_RUNTIME: container
      NODEZUNO_SQLITE_PATH: /var/lib/nodezuno/nodezuno.sqlite
      NODEZUNO_WEB_REPLICA_COUNT: "1"
    entrypoint:
      - sh
      - -c
      - node scripts/preflight-deployment-topology.mjs payment-worker && exec node scripts/process-stablecoin-payments.mjs --once
    volumes:
      - /opt/nodezuno/data:/var/lib/nodezuno
    networks:
      nodezuno-payment-egress: {}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.25
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${NODEZUNO_APP_LOG_GROUP:?Set NODEZUNO_APP_LOG_GROUP}
        awslogs-stream: payment-worker
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 1m

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    pull_policy: missing
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL}
      NODEZUNO_DOMAIN: ${NODEZUNO_DOMAIN:?Set NODEZUNO_DOMAIN}
    depends_on:
      nodezuno:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      nodezuno-front: {}
    volumes:
      - /opt/nodezuno/host-current/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/nodezuno/caddy/data:/data
      - /opt/nodezuno/caddy/config:/config
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
    mem_reservation: 48m
    cpus: 0.5
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${NODEZUNO_CADDY_LOG_GROUP:?Set NODEZUNO_CADDY_LOG_GROUP}
        awslogs-stream: edge
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 2m

networks:
  nodezuno-front:
    name: nodezuno-front
    ipam:
      config:
        - subnet: 172.29.240.0/28
  nodezuno-web-egress:
    name: nodezuno-web-egress
    ipam:
      config:
        - subnet: 172.29.243.0/28
  nodezuno-email-egress:
    name: nodezuno-email-egress
    ipam:
      config:
        - subnet: 172.29.241.0/28
  nodezuno-payment-egress:
    name: nodezuno-payment-egress
    ipam:
      config:
        - subnet: 172.29.242.0/28
