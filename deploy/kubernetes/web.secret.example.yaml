apiVersion: v1
kind: Secret
metadata:
  name: nodezuno-web-secrets
  labels:
    app.kubernetes.io/name: nodezuno-web
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  RATE_LIMIT_SECRET: replace-with-independent-random-secret
  BETTER_AUTH_SECRET: replace-with-independent-random-secret
  REVIEW_CAPABILITY_SECRET: replace-with-independent-random-secret
  NODEZUNO_ADMIN_EMAILS: info@nodezuno.com
  ZOHO_SMTP_HOST: smtp.zoho.in
  ZOHO_SMTP_PASSWORD: replace-with-zoho-app-password
  NODEZUNO_ETHEREUM_RPC_ENDPOINTS_JSON: ""
  NODEZUNO_DELIVERABLE_BUCKET: replace-with-private-deliverables-bucket
  NODEZUNO_DELIVERABLE_KMS_KEY_ARN: arn:aws:kms:ap-south-1:000000000000:key/00000000-0000-4000-8000-000000000000
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
