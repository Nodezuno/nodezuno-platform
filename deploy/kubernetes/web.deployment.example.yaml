apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodezuno-web
  labels:
    app.kubernetes.io/name: nodezuno-web
    app.kubernetes.io/component: control-plane
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodezuno-web-data
  labels:
    app.kubernetes.io/name: nodezuno-web
    app.kubernetes.io/component: control-plane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodezuno-web
  labels:
    app.kubernetes.io/name: nodezuno-web
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nodezuno-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodezuno-web
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: nodezuno-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: database-migration
          image: "REGISTRY.example/nodezuno-web@sha256:REPLACE_WITH_IMAGE_DIGEST"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              node scripts/migrate-container.mjs &&
              node scripts/preflight-control-plane.mjs &&
              node scripts/preflight-stablecoin-payments.mjs &&
              node scripts/process-stablecoin-payments.mjs --once
          envFrom:
            - configMapRef:
                name: nodezuno-web-config
            - secretRef:
                name: nodezuno-web-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/nodezuno
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: web
          image: "REGISTRY.example/nodezuno-web@sha256:REPLACE_WITH_IMAGE_DIGEST"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              node scripts/preflight-control-plane.mjs && exec node server.js
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nodezuno-web-config
            - secretRef:
                name: nodezuno-web-secrets
          startupProbe:
            httpGet:
              path: /api/v1/live
              port: http
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: http
              scheme: HTTP
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
              scheme: HTTP
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: data
              mountPath: /var/lib/nodezuno
            - name: next-cache
              mountPath: /app/.next/cache
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nodezuno-web-data
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nodezuno-web
  labels:
    app.kubernetes.io/name: nodezuno-web
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nodezuno-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nodezuno-web
  labels:
    app.kubernetes.io/name: nodezuno-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nodezuno-web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nodezuno-web
  labels:
    app.kubernetes.io/name: nodezuno-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nodezuno-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              nodezuno.com/ingress: "true"
          podSelector:
            matchLabels:
              nodezuno.com/ingress: "true"
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
