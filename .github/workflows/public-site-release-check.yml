name: Nodezuno public site release check

on:
  workflow_call:
    inputs:
      origin:
        description: Public origin to verify after deployment
        required: true
        type: string
  workflow_dispatch:
    inputs:
      origin:
        description: Public origin to verify after deployment
        required: true
        default: https://nodezuno.com
        type: string

permissions:
  contents: read

concurrency:
  group: nodezuno-public-site-${{ inputs.origin }}
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0

      - name: Verify same-origin pages and fragments
        run: node scripts/check-public-links.mjs "${{ inputs.origin }}"

      - name: Verify external references
        run: node scripts/check-external-links.mjs
